<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ChainScout private multi-asset command center</title>
  <desc id="desc">Track crypto, NFTs, tokenized assets, Pokémon cards, collectibles, and manual assets in one encrypted local Vault with read-only public intelligence.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity=".022"/>
    </pattern>
    <clipPath id="logo-cut">
      <path d="M0 0H64L78 14V78H14L0 64Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#1a1918"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="650" height="630" fill="#181716"/>
  <path d="M650 0V630" stroke="#34312f"/>

  <g transform="translate(58 48)">
    <g clip-path="url(#logo-cut)">
      <rect width="78" height="78" fill="#fa6c34"/>
      <image href="logo.svg" x="16" y="16" width="46" height="46"/>
    </g>
    <text x="101" y="32" fill="#f2e9df" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="-.6">ChainScout</text>
    <text x="102" y="58" fill="#a49b93" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">PRIVATE ASSET WORKSPACE</text>
  </g>

  <g transform="translate(58 176)">
    <rect width="36" height="2" fill="#fa6c34"/>
    <text x="50" y="6" fill="#b6ada5" font-family="'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="1.4">PRIVATE MULTI-ASSET COMMAND CENTER</text>

    <text x="0" y="86" fill="#f4ece4" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="-2.2">Know what you own.</text>
    <text x="0" y="150" fill="#f4ece4" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="-2.2">Keep the context</text>
    <text x="0" y="214" fill="#fa6c34" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="-2.2">yours.</text>

    <text x="1" y="268" fill="#b9b0a7" font-family="Arial, Helvetica, sans-serif" font-size="18">Crypto · NFTs · tokenized assets · Pokémon / TCG</text>
    <text x="1" y="298" fill="#b9b0a7" font-family="Arial, Helvetica, sans-serif" font-size="18">collectibles · any manual asset</text>

    <rect x="0" y="348" width="214" height="42" rx="3" fill="#fa6c34"/>
    <text x="107" y="374" text-anchor="middle" fill="#1a1918" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">ENCRYPTED LOCALLY</text>
    <text x="236" y="374" fill="#9e958d" font-family="Arial, Helvetica, sans-serif" font-size="12">Read-only public tools</text>
  </g>

  <g transform="translate(700 55)">
    <rect width="450" height="520" rx="5" fill="#211f1d" stroke="#48423e"/>
    <rect x="1" y="1" width="448" height="73" rx="4" fill="#24211f"/>
    <rect x="22" y="17" width="40" height="40" rx="3" fill="#fa6c34"/>
    <path d="M34 37h16M42 29v16" stroke="#1a1918" stroke-width="2"/>
    <text x="78" y="36" fill="#f0e8df" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Your local Vault</text>
    <text x="78" y="53" fill="#918980" font-family="Arial, Helvetica, sans-serif" font-size="10">Assets and their context, in one place</text>
    <rect x="329" y="23" width="97" height="28" rx="14" fill="none" stroke="#504a45"/>
    <text x="377" y="41" text-anchor="middle" fill="#aaa19a" font-family="'Courier New', monospace" font-size="7" font-weight="700" letter-spacing=".8">LOCAL ONLY</text>

    <g transform="translate(22 97)">
      <g>
        <rect width="40" height="40" rx="3" fill="#28231f" stroke="#7e4d39"/>
        <circle cx="20" cy="20" r="9" fill="none" stroke="#fa6c34" stroke-width="2"/>
        <path d="M13 20h14" stroke="#fa6c34" stroke-width="2"/>
        <text x="56" y="15" fill="#fa8a60" font-family="Arial, Helvetica, sans-serif" font-size="9">Crypto</text>
        <text x="56" y="33" fill="#eee5dd" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">WETH + USDG</text>
        <text x="404" y="26" text-anchor="end" fill="#918980" font-family="Arial, Helvetica, sans-serif" font-size="9">Public snapshot · private lots</text>
      </g>
      <path d="M0 57H406" stroke="#393531"/>
      <g transform="translate(0 72)">
        <rect width="40" height="40" rx="3" fill="#20252a" stroke="#49667b"/>
        <rect x="12" y="12" width="16" height="16" fill="none" stroke="#7cc4f8" stroke-width="2"/>
        <text x="56" y="15" fill="#8dcef9" font-family="Arial, Helvetica, sans-serif" font-size="9">NFT</text>
        <text x="56" y="33" fill="#eee5dd" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">ERC-721 / ERC-1155</text>
        <text x="404" y="26" text-anchor="end" fill="#918980" font-family="Arial, Helvetica, sans-serif" font-size="9">Token IDs · encrypted notes</text>
      </g>
      <path d="M0 129H406" stroke="#393531"/>
      <g transform="translate(0 144)">
        <rect width="40" height="40" rx="3" fill="#26222a" stroke="#67547b"/>
        <path d="M11 27h18M14 25V16h12v9M12 16l8-5 8 5" fill="none" stroke="#c9a6ff" stroke-width="1.8"/>
        <text x="56" y="15" fill="#cfb1fb" font-family="Arial, Helvetica, sans-serif" font-size="9">Tokenized asset</text>
        <text x="56" y="33" fill="#eee5dd" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">AAPL Stock Token</text>
        <text x="404" y="26" text-anchor="end" fill="#918980" font-family="Arial, Helvetica, sans-serif" font-size="9">Source-linked evidence</text>
      </g>
      <path d="M0 201H406" stroke="#393531"/>
      <g transform="translate(0 216)">
        <rect width="40" height="40" rx="3" fill="#29241f" stroke="#77573b"/>
        <path d="M20 10l9 10-9 10-9-10z" fill="none" stroke="#d8a06b" stroke-width="1.8"/>
        <text x="56" y="15" fill="#e0ad7b" font-family="Arial, Helvetica, sans-serif" font-size="9">Collectible</text>
        <text x="56" y="33" fill="#eee5dd" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Charizard · Base Set 4/102</text>
        <text x="404" y="26" text-anchor="end" fill="#918980" font-family="Arial, Helvetica, sans-serif" font-size="9">Owner-entered context</text>
      </g>
    </g>

    <g transform="translate(22 398)">
      <text x="0" y="0" fill="#ddd3ca" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Collectible value history</text>
      <text x="0" y="18" fill="#918980" font-family="Arial, Helvetica, sans-serif" font-size="9">Dated owner references—not a hidden market feed.</text>
      <path d="M0 82 C48 78 61 61 99 65 S157 48 196 52 S252 29 296 37 S363 20 406 13" fill="none" stroke="#fa6c34" stroke-width="2.5"/>
      <path d="M0 82 C48 78 61 61 99 65 S157 48 196 52 S252 29 296 37 S363 20 406 13 V91 H0Z" fill="#fa6c34" opacity=".08"/>
    </g>
  </g>

  <path d="M18 48V18H48M1152 18H1182V48M18 582V612H48M1152 612H1182V582" fill="none" stroke="#fa6c34" stroke-opacity=".5" stroke-width="2"/>
</svg>
